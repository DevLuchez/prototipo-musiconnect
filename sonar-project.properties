# Configuração do SonarCloud (análise de qualidade e segurança).
# Usada pelo job "sonar" de .github/workflows/ci.yml.
sonar.organization=devluchez
sonar.projectKey=DevLuchez_prototipo-musiconnect
sonar.projectName=MusiConnect

sonar.sourceEncoding=UTF-8

# Código da aplicação (backend FastAPI + app Flutter)
sonar.sources=back_musiconnect/app,front_musiconnect/lib
sonar.tests=back_musiconnect/tests,front_musiconnect/test

# Backend
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage-backend.xml

# App Flutter
sonar.dart.lcov.reportPaths=front_musiconnect/coverage/lcov.info
