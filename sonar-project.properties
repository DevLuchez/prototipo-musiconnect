# Configuração do SonarCloud — projeto da API (backend FastAPI).
# Usada pelo job "sonar" de .github/workflows/ci.yml. O app Flutter é um
# projeto separado (sonar-project-app.properties), com a própria nota.
sonar.organization=devluchez
sonar.projectKey=DevLuchez_prototipo-musiconnect
sonar.projectName=MusiConnect — API

sonar.sourceEncoding=UTF-8

sonar.sources=back_musiconnect/app
sonar.tests=back_musiconnect/tests

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage-backend.xml
